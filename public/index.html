<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .producto { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .producto h3 { margin: 0 0 5px 0; }
        .precio { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Catálogo de Productos</h1>
    <div id="lista-productos">
        <p>Cargando productos...</p>
    </div>

    <script>
        // Obtener productos al cargar la página
        fetch('/api/productos')
            .then(response => response.json())
            .then(productos => {
                const contenedor = document.getElementById('lista-productos');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                if (productos.length === 0) {
                    contenedor.innerHTML = '<p>No hay productos disponibles.</p>';
                    return;
                }

                // Generar HTML para cada producto
                productos.forEach(producto => {
                    const div = document.createElement('div');
                    div.className = 'producto';
                    div.innerHTML = `
                        <h3>${producto.nombre}</h3>
                        <p>ID: ${producto.id}</p>
                        <p class="precio">$${producto.precio}</p>
                    `;
                    contenedor.appendChild(div);
                });
            })
            .catch(error => {
                console.error('Error fetching productos:', error);
                document.getElementById('lista-productos').innerHTML = '<p>Error al cargar productos.</p>';
            });
    </script>
</body>
</html>
